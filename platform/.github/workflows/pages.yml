name: Publish App and Hub to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-platform
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Assemble static site
        env:
          SITE_PREFIX: /platform
        run: |
          mkdir -p site/app site/hub site/extensions
          VITE_BASE_PATH=/platform/app/ npm run build -w @aprincar/app
          VITE_BASE_PATH=/platform/hub/ npm run build -w @aprincar/hub
          cp -R apps/app/dist/. site/app/
          cp -R apps/hub/dist/. site/hub/
          cp -R apps/app/dist/extensions/. site/extensions/
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const file of ['site/app/registry.json', 'site/hub/registry.json']) {
            const entries = JSON.parse(fs.readFileSync(file, 'utf8'));
            for (const entry of entries) {
              for (const key of ['manifestUrl', 'entryUrl']) {
                if (entry[key]?.startsWith('/extensions/')) entry[key] = `/platform${entry[key]}`;
              }
            }
            fs.writeFileSync(file, `${JSON.stringify(entries, null, 2)}\n`);
          }
          NODE
          cp site/app/registry.json site/registry.json
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR">
            <head>
              <meta charset="utf-8" />
              <meta http-equiv="refresh" content="0;url=app/" />
              <meta name="viewport" content="width=device-width,initial-scale=1" />
              <title>Aprincar</title>
            </head>
            <body>
              <p>Abrindo o <a href="app/">Aprincar</a>…</p>
              <script>location.replace('app/' + location.search + location.hash);</script>
            </body>
          </html>
          HTML
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
