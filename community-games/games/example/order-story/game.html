<!doctype html><meta charset="utf-8"><style>body{font-family:system-ui;background:#f7f6f2;display:grid;place-items:center;height:100vh}.box{background:white;padding:32px;border-radius:24px}button{font-size:22px;padding:16px;margin:8px;border:0;border-radius:16px;background:#6f5bd7;color:white}</style><div class="box"><h1>Coloque a história em ordem</h1><p>🌱 → 🌿 → 🌳</p><button id="ok">Eu descobri!</button><p id="status"></p></div><script>let p;const pending=new Map;addEventListener('message',e=>{if(e.data?.type==='APRINCAR_CONNECT'&&e.ports[0]){p=e.ports[0];p.onmessage=e=>{let m=e.data,x=pending.get(m.requestId);if(x){pending.delete(m.requestId);m.ok?x[0](m.payload):x[1](m.error)}};p.start();p.postMessage({type:'game.ready'})}});function req(type,payload){let id=crypto.randomUUID();return new Promise((a,b)=>{pending.set(id,[a,b]);p.postMessage({type,requestId:id,payload})})}ok.onclick=async()=>{await req('session.start',{});await req('evidence.submit',{skillId:'language.story.sequence',result:'success',independent:true,assistance:'none',difficulty:.4,confidence:.8});status.textContent='Sequência registrada!'};</script>
